<title>Affiche avis Google — NEO Carrosserie</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Helvetica Neue',Arial,sans-serif;background:#4a4a4a}
  body{display:flex;justify-content:center;align-items:center}
  .poster{position:relative;width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16;background:#fff;
           display:flex;flex-direction:column;align-items:center;overflow:hidden}
  .logo{width:74%;margin-top:8%;}
  .circle{width:82%;aspect-ratio:1;border-radius:50%;margin-top:7%;
           background:conic-gradient(from -45deg,#4285F4 0deg 90deg,#EA4335 90deg 180deg,#FBBC05 180deg 270deg,#34A853 270deg 360deg);
           display:flex;align-items:center;justify-content:center;}
  .inner{width:93%;aspect-ratio:1;border-radius:50%;background:#fff;
          display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6%;}
  .h1{font-size:min(6.6vw,42px);font-weight:800;color:#202124;margin-bottom:2%;}
  .goog{font-size:min(11vw,70px);font-weight:700;letter-spacing:-1px;line-height:1;}
  .goog .b{color:#4285F4} .goog .r{color:#EA4335} .goog .y{color:#FBBC05} .goog .g{color:#34A853}
  .stars{color:#FBBC05;font-size:min(6.6vw,42px);letter-spacing:3px;margin:2% 0 4%;}
  .qr{width:52%;aspect-ratio:1;background:#fff;border:2px solid #eee;border-radius:8px;padding:4px;}
  .qr img{width:100%;height:100%;display:block;}
  .scan{margin-top:5%;font-size:min(4.2vw,24px);font-weight:700;color:#202124;text-align:center;}
  .scan small{display:block;font-weight:400;color:#5f6368;font-size:min(3.4vw,18px);margin-top:1.5%;}
  .foot{position:absolute;bottom:0;left:0;right:0;background:#15140F;color:#d8d3ca;
         text-align:center;font-size:min(3vw,15px);padding:2.6% 4%;letter-spacing:.3px;}
  .foot b{color:#fff}
</style></head>
